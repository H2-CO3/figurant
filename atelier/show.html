<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- A project may import the engine by name, as it would once installed. -->
<script type="importmap">{ "imports": { "figurant": "/__figurant/engine/index.js" } }</script>
<title>Figurant scene</title>
<link rel="icon" type="image/svg+xml" href="/__figurant/atelier/favicon.svg">
<style>
  :root { --fig-ink: #1c1c1c; --fig-paper: #faf9f6; --fig-accent: #b8860b; }
  html, body { margin: 0; height: 100%; background: var(--fig-paper); color: var(--fig-ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #floor { position: absolute; left: 3%; right: 3%; top: 70%; border-top: 2px solid color-mix(in srgb, var(--fig-ink) 22%, var(--fig-paper)); }
  #problems { position: absolute; left: 12px; top: 10px; right: 12px; color: #a3341c; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
<div id="problems"></div>
<div id="floor"></div>
<script type="module">
// One scene: several characters on one floor, each following its track. The
// atelier drives the clock (speed, pause, frame by frame) and reads the time.
import { advance } from './hold.js';
import { createClock, createStage, createFx, playComposition, checkComposition, compositionLength, describeProblems } from '/__figurant/engine/index.js';

const params = new URLSearchParams(location.search);
// The style in use lends its colours to the stage: the page's ink, paper and accent.
for (const key of ['paper', 'ink', 'accent']) {
    const colour = params.get(key);
    if (/^#[0-9a-f]{6}$/i.test(colour ?? '')) document.documentElement.style.setProperty(`--fig-${key}`, colour);
}
const say = text => { document.getElementById('problems').textContent = text; };
const stage = { ready: false, problems: [], speed: Number(params.get('speed')) || 1, playing: true, time: 0, length: 0 };
window.stage = stage;

try {
    const { configAddress } = await import('./where.js');
    const config = (await import(configAddress(location.search))).default;
    const name = params.get('scene');
    const composition = config.compositions?.[name];
    if (!composition) throw new Error(`No scene named "${name}" in the configuration.`);
    const everyone = { ...config.cast, ...config.emoji };
    const characters = Object.fromEntries(Object.entries(everyone).map(([key, member]) => [key, member.character]));
    const project = { characters, animations: config.scenes ?? {}, props: config.props ?? {} };
    stage.problems = describeProblems(checkComposition(name, composition, project));
    say(stage.problems.join('\n'));

    const clock = createClock();
    const svg = createStage();
    const floor = document.getElementById('floor');
    // The scene is sized to fit the width it asks for.
    const unit = () => Math.min(1.6, (innerWidth * 0.92) / (composition.width ?? 600));
    const show = playComposition({
        stage: svg, clock, composition, ...project, fx: createFx({ stage: svg, clock }), unit: unit(),
        origin: () => { const box = floor.getBoundingClientRect(); return [box.left + box.width / 2, box.top]; },
    });
    stage.length = compositionLength(composition);
    let last = performance.now();
    const loop = now => {
        const dt = Math.min(50, now - last);
        last = now;
        if (stage.playing) { clock.tick(dt * stage.speed); stage.time = show.time(); }
        requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    stage.step = (ms = 1000 / 60) => { stage.playing = false; advance(clock, ms); stage.time = show.time(); };
    // Going to a moment: time is run forward to it, out of sight, letting each step of the
    // scene happen on the way; then it holds there. Going back starts again from the beginning.
    const breath = () => new Promise(done => { const channel = new MessageChannel(); channel.port1.onmessage = () => done(); channel.port2.postMessage(0); });
    let seeking = 0;
    stage.seek = async ms => {
        const mine = ++seeking;
        stage.playing = false; stage.seeking = true;
        document.documentElement.style.visibility = 'hidden';
        for (let guard = 0; show.time() < ms && guard < 20000 && mine === seeking; guard++) { clock.tick(Math.min(50, ms - show.time())); await breath(); }
        if (mine !== seeking) return;
        stage.time = show.time();
        document.documentElement.style.visibility = '';
        stage.seeking = false;
    };
    const start = Number(params.get('seek'));
    if (start > 0) await stage.seek(start);
    stage.ready = true;
} catch (error) {
    stage.problems = [String(error.message || error)];
    say(stage.problems[0]);
}
</script>
</body>
</html>
